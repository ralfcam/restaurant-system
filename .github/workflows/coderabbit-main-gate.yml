name: CodeRabbit US latest-head gate

# pull_request_review_thread is not an Actions trigger.
# The job is paused and does not run a check.
on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coderabbit-us-latest-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coderabbit-us-latest-head-gate:
    name: CodeRabbit US latest-head gate
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: CodeRabbit US latest-head gate is paused
        run: echo "CodeRabbit US latest-head gate is paused."
